name: Release

on:
  push:
    branches: [main]
  # So a failed publish can be retried without an empty commit.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Trusted publishing: npm mints a short-lived credential from this token, so
  # the repository never holds a long-lived NPM_TOKEN that could leak.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # npm 11.5.1+ is what understands trusted publishing.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      # Opens or updates a "Version Packages" pull request while changesets are
      # pending. Publishing is done below, not here.
      - name: Version
        id: changesets
        uses: changesets/action@v1
        with:
          # One npm script, not a shell line: this input is passed to pnpm as
          # arguments, so `a && b` arrives as the literal argument `&&` and
          # changesets exits complaining about it. The script also syncs the
          # VERSION constants, which changesets does not know about — without
          # that, every release publishes packages reporting the previous
          # version from --version and /health, which 0.2.0 did.
          version: pnpm version-packages
          title: "Version packages"
          commit: "Version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # What npm is actually being offered, when it says no.
      #
      # A trusted-publishing 403 says "OIDC permission denied" and nothing about
      # which claim did not match, so the only way to settle it is to print the
      # claims and compare them with what the package has configured. These are
      # not secrets — the token itself is never printed — and having them in
      # every release log is what turns the next 403 into a one-minute fix
      # instead of an afternoon.
      - name: Show the identity npm will check
        run: |
          set -euo pipefail
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).value))")
          node -e '
            const claims = JSON.parse(Buffer.from(process.argv[1].split(".")[1], "base64url").toString());
            for (const key of ["repository", "repository_owner", "workflow_ref", "job_workflow_ref", "ref", "environment"]) {
              console.log(`${key}: ${claims[key] ?? "(not set)"}`);
            }
          ' "$token"

      # Only once the Version pull request has been merged.
      #
      # While changesets are still pending, the step above has just bumped
      # versions in the working tree for the pull request. Publishing them here
      # would put versions on npm that are not on main and that nobody has
      # looked at — which is what this workflow did until now.
      - name: Publish to npm
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          set -e

          # Packed with pnpm and published with npm, because each does one half.
          #
          # npm leaves pnpm's "workspace:*" in the tarball, and every install of
          # that fails with `Unsupported URL Type "workspace:"` — which is how
          # 0.1.0 shipped three uninstallable packages. pnpm rewrites it to a
          # real version. But trusted publishing is an npm CLI feature, and
          # publishing with pnpm is refused with "OIDC permission denied".
          #
          # So: pnpm builds the tarball, npm publishes it.
          mkdir -p /tmp/tarballs

          # In dependency order by hand: each package must exist on the registry
          # before the ones that depend on it can install.
          for p in core templates web server cli; do
            dir="packages/$p"
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")

            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi

            echo "Packing $name@$version"
            (cd "$dir" && pnpm pack --pack-destination /tmp/tarballs)

            tarball=$(ls -t /tmp/tarballs/*.tgz | head -1)
            echo "Publishing $tarball"
            npm publish "$tarball" --access public --provenance
          done

  # SR-069: the same version, as a container.
  #
  # A separate job so a failure here cannot roll back a successful npm publish,
  # and so the image is built from what is actually on the registry rather than
  # from this working tree. Two ways of producing the product would eventually
  # disagree about something nobody was watching.
  docker:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: echo "value=$(node -p "require('./packages/cli/package.json').version")" >> "$GITHUB_OUTPUT"

      # Nothing to build when the version is already on ghcr: the release job
      # runs on every push to main, and most of those publish nothing.
      - id: exists
        run: |
          if docker manifest inspect "ghcr.io/staffroom-ai/staffroom:${{ steps.version.outputs.value }}" > /dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      # The image installs staffroom from npm, and the publish that just happened
      # is not immediately visible to every registry mirror. The first 0.3.0
      # build failed on exactly this: `npm error notarget No matching version
      # found for staffroom@0.3.0`, a minute after the release job published it.
      # So the build waits for the thing it is about to install.
      - name: Wait for npm to serve the version being built
        if: steps.exists.outputs.value == 'false'
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          for attempt in $(seq 1 30); do
            if npm view "staffroom@${version}" version > /dev/null 2>&1; then
              echo "staffroom@${version} is on the registry after ${attempt} attempt(s)."
              exit 0
            fi
            echo "staffroom@${version} not on the registry yet; attempt ${attempt}."
            sleep 10
          done
          echo "staffroom@${version} never appeared on the registry. The release job says it published it, so check npm before re-running."
          exit 1

      - if: steps.exists.outputs.value == 'false'
        uses: docker/setup-qemu-action@v3
      - if: steps.exists.outputs.value == 'false'
        uses: docker/setup-buildx-action@v3
      - if: steps.exists.outputs.value == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built for this runner first and loaded locally, so the smoke test below
      # runs the real image rather than trusting that a multi-arch build works.
      # Pushing something nobody has started is how you find out on a user's
      # machine.
      - if: steps.exists.outputs.value == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: staffroom:smoke
          build-args: STAFFROOM_VERSION=${{ steps.version.outputs.value }}

      - name: The image runs the demo and answers health
        if: steps.exists.outputs.value == 'false'
        run: |
          set -euo pipefail

          # No volume, no environment: the acceptance case is somebody running
          # this with nothing configured and getting a working office.
          docker run -d --name smoke -p 127.0.0.1:4242:4242 staffroom:smoke

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4242/api/health > /tmp/health.json 2>/dev/null; then break; fi
            sleep 2
          done

          echo "health: $(cat /tmp/health.json)"
          node -e '
            const h = require("/tmp/health.json");
            if (h.ok !== true) throw new Error("health did not answer ok");
            if (h.mode !== "demo") throw new Error(`expected demo mode, got ${h.mode}`);
          '

          # The checks are still on. A container that dropped them because it
          # binds 0.0.0.0 would be one anybody on the network could drive.
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST -H "Origin: http://evil.example" http://127.0.0.1:4242/api/health)
          test "$code" = "403" || { echo "cross-origin POST got $code, expected 403"; exit 1; }

          # The origin check is the one enforced at the upgrade. The token is
          # checked at the `hello` message instead, so the server can close with
          # a reason rather than dropping the handshake — which means a plain
          # upgrade answering 101 is correct, and asserting otherwise would be
          # asserting the opposite of the design.
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Connection: Upgrade" -H "Upgrade: websocket" \
            -H "Origin: http://evil.example" \
            -H "Sec-WebSocket-Key: $(head -c16 /dev/zero | base64)" \
            -H "Sec-WebSocket-Version: 13" http://127.0.0.1:4242/ws)
          test "$code" = "403" || { echo "cross-origin upgrade got $code, expected 403"; exit 1; }

          echo "The image serves a demo office, and refuses what it should."
          docker rm -f smoke

      - name: Push
        if: steps.exists.outputs.value == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: STAFFROOM_VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/staffroom-ai/staffroom:${{ steps.version.outputs.value }}
            ghcr.io/staffroom-ai/staffroom:latest
