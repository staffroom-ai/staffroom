name: Release

on:
  push:
    branches: [main]
  # So a failed publish can be retried without an empty commit.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Trusted publishing: npm mints a short-lived credential from this token, so
  # the repository never holds a long-lived NPM_TOKEN that could leak.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # npm 11.5.1+ is what understands trusted publishing.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      # Opens or updates a "Version Packages" pull request while changesets are
      # pending. Publishing is done below, not here.
      - name: Version
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          title: "Version packages"
          commit: "Version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Published with npm, not pnpm. Trusted publishing is an npm CLI feature
      # (11.5.1+) and `pnpm changeset publish` publishes with pnpm, which was
      # refused with "OIDC permission denied". Dependency order by hand, because
      # each package must exist before the ones that depend on it.
      - name: Publish to npm
        run: |
          set -e
          for p in core templates web server cli; do
            dir="packages/$p"
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi
            echo "Publishing $name@$version"
            (cd "$dir" && npm publish --access public --provenance)
          done
