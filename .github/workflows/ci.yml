name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
        env:
          CHANGESET_BASE: origin/${{ github.base_ref || 'main' }}
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: macos-14
            node: 22
          - os: windows-2022
            node: 22
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: packages/*/coverage
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Every package packs, and installs
        # pnpm pack, not npm pack: only pnpm rewrites `workspace:*` into a real
        # version. `npm pack` produced a tarball nobody could install and said
        # nothing, so this step passed while shipping something broken.
        run: |
          mkdir -p /tmp/tarballs
          for p in packages/core packages/templates packages/web packages/server packages/cli; do
            (cd "$p" && pnpm pack --pack-destination /tmp/tarballs)
          done
          for t in /tmp/tarballs/*.tgz; do
            if tar -xzOf "$t" package/package.json | grep -q '"workspace:'; then
              echo "$t still contains a workspace: dependency"
              exit 1
            fi
          done

      - name: The published CLI actually runs
        # Installed from the tarballs into an empty directory, the way a user
        # gets it. This is the only check that sees what they see: an optional
        # peer that is present in this repo and absent everywhere else made every
        # installed copy fail on launch, while every other job stayed green.
        run: |
          mkdir -p /tmp/fresh && cd /tmp/fresh
          npm init -y > /dev/null
          npm install /tmp/tarballs/*.tgz > /dev/null
          ./node_modules/.bin/staffroom --version
          ./node_modules/.bin/staffroom init --dir ./office --tools > /dev/null
          ./node_modules/.bin/staffroom doctor --office ./office
          ./node_modules/.bin/staffroom demo --no-open --port 0 --office ./office --exit-when-ready

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chromium
        run: pnpm --filter @staffroom/web exec playwright install --with-deps chromium
      - name: Smoke test
        run: pnpm --filter @staffroom/web e2e
      - name: No office left running
        # Teardown kills the child it started. A server still holding a port here
        # would make the next run fail for a reason unrelated to the change.
        run: |
          if pgrep -f "cli/dist/index.js" > /dev/null; then
            echo "An office survived teardown:"
            pgrep -af "cli/dist/index.js"
            exit 1
          fi
          echo "Nothing left running."
      - name: Size budget
        run: pnpm --filter @staffroom/web size | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the trace when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: packages/web/test-results/
          retention-days: 7
